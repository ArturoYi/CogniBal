# 版本目录。模块用 libs.xxx 引用，避免在 build.gradle.kts 里散落版本号。
[versions]
# Android Gradle Plugin 9。compileSdk { version = release(...) } 依赖这一代 DSL。
agp = "9.3.3"
# Kotlin 与 Compose 编译器插件。
kotlin = "2.2.10"
# Compose 组件的版本平台。下面没写 version.ref 的 androidx.compose 库都跟它走。
composeBom = "2026.02.01"

# 以下库不在 Compose BOM 里，版本写在这里。
coreKtx = "1.10.1"
# 应用内语言。API 33 以下靠它保存并在 Activity 重建时生效。
appcompat = "1.7.1"
splashscreen = "1.0.1"
activityCompose = "1.8.0"
# viewModel()、collectAsStateWithLifecycle()。
lifecycle = "2.11.0"
# Preferences DataStore，设置项的本地存储。
datastore = "1.2.1"
# Room 2.8。协程和 Flow 已包含在 room-runtime 里，不再单独依赖 room-ktx。
room = "2.8.5"
# 适配 AGP 9 内置 Kotlin 的 KSP。Room、Hilt 都用它生成代码，不用 kapt。
ksp = "2.3.6"
# 适配 AGP 9 的 Hilt。
hilt = "2.59.2"
# JSON 业务备份。1.9.0 按 Kotlin 2.2 构建。
serialization = "1.9.0"
# 账本备份的 AES-256 加密 zip。界面只经 LedgerBackup 使用。
zip4j = "2.11.5"
# 蓝牙迁移的一次性 X25519。口令备份不使用这里的密钥。
bouncycastle = "1.79"
# Navigation 3。返回栈和页面切换。
nav3Core = "1.2.0"
# 列表-详情场景。1.3 才有 ListDetailSceneStrategy，会带上同版本的 adaptive。
adaptiveNavigation3 = "1.3.0"
[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "splashscreen" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
zip4j = { group = "net.lingala.zip4j", name = "zip4j", version.ref = "zip4j" }
bouncycastle = { group = "org.bouncycastle", name = "bcprov-jdk18on", version.ref = "bouncycastle" }
androidx-navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "nav3Core" }
androidx-navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "nav3Core" }
androidx-adaptive-navigation3 = { group = "androidx.compose.material3.adaptive", name = "adaptive-navigation3", version.ref = "adaptiveNavigation3" }

# 平台依赖，本身不含代码，只约束下面这组库的版本。
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
# 全量 Material Icons。版本由 Compose BOM 约束，并会带上其中的 core 图标。
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
# 窗口尺寸与导航套件：手机底栏、宽屏侧栏。
androidx-adaptive = { group = "androidx.compose.material3.adaptive", name = "adaptive" }
androidx-adaptive-navigation-suite = { group = "androidx.compose.material3", name = "material3-adaptive-navigation-suite" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# 版本号跟 Kotlin 对齐，不跟 kotlinx-serialization 库的版本走。
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
